<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Luminous Emerald-Mint Reactive Signal Gradient -->
    <linearGradient id="radui-grad-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="radui-grad-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="radui-grad-kick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <filter id="radui-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group with tight transparent bounds, centered in 240x240 -->
  <g id="radui-symbol">
    <!-- 1. Left Vertical Stem (The Python Architecture Pillar) -->
    <rect x="36" y="28" width="34" height="184" rx="17" fill="url(#radui-grad-stem)" />

    <!-- 2. The Reactive Signal Loop (Continuous DAG Arc) -->
    <path d="M 53 28
             H 136
             C 186 28, 206 60, 206 98
             C 206 136, 186 166, 136 166
             H 70"
          stroke="url(#radui-grad-loop)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 3. Dynamic Reactive Kick Beam (Shoots outward to DOM target) -->
    <path d="M 120 148
             L 194 212"
          stroke="url(#radui-grad-kick)"
          stroke-width="34"
          stroke-linecap="round" />

    <!-- 4. Reactive DAG State Nodes (Genuinely vector, transparent integration) -->
    <g filter="url(#radui-glow)">
      <!-- Root State Node -->
      <circle cx="53" cy="45" r="7.5" fill="#f0fdf4" stroke="#059669" stroke-width="2.5" />
      <!-- Derived / Computed Signal Node -->
      <circle cx="206" cy="98" r="7.5" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5" />
      <!-- Reactive Stream Emit Node -->
      <circle cx="194" cy="212" r="9" fill="#ffffff" stroke="#34d399" stroke-width="3" />
    </g>

    <!-- Subtle Reactive Orbit Wave -->
    <path d="M 148 58 C 170 70, 182 86, 182 108"
          stroke="rgba(52, 211, 153, 0.45)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-dasharray="4 5" />
  </g>
</svg>
