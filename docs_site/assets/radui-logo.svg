<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="100%" height="100%" fill="none">
  <defs>
    <!-- Luminous Emerald-Mint Reactive Signal Gradient -->
    <linearGradient id="logo-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="logo-loop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="logo-kick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent vector mark (Height ~44px, centered vertically) -->
  <g transform="translate(4, 6) scale(0.185)">
    <!-- 1. Left Vertical Stem -->
    <rect x="36" y="28" width="34" height="184" rx="17" fill="url(#logo-stem)" />

    <!-- 2. The Reactive Signal Loop -->
    <path d="M 53 28 H 136 C 186 28, 206 60, 206 98 C 206 136, 186 166, 136 166 H 70"
          stroke="url(#logo-loop)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 3. Dynamic Reactive Kick Beam -->
    <path d="M 120 148 L 194 212"
          stroke="url(#logo-kick)"
          stroke-width="34"
          stroke-linecap="round" />

    <!-- 4. Reactive DAG State Nodes -->
    <g filter="url(#logo-glow)">
      <circle cx="53" cy="45" r="7.5" fill="#f0fdf4" stroke="#059669" stroke-width="2.5" />
      <circle cx="206" cy="98" r="7.5" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5" />
      <circle cx="194" cy="212" r="9" fill="#ffffff" stroke="#34d399" stroke-width="3" />
    </g>
  </g>

  <!-- Wordmark "radui" in precision geometric typography with currentColor fill for auto-theme adaption -->
  <text x="56" y="38"
        fill="currentColor"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="-1px">radui</text>

  <!-- "DOCS" Badge Pill -->
  <g transform="translate(142, 19)">
    <rect width="48" height="20" rx="6" fill="#e7f1eb" stroke="#d0e4d6" stroke-width="1" class="radui-docs-badge-bg" />
    <text x="24" y="14"
          text-anchor="middle"
          fill="#206b52"
          font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="9.5"
          font-weight="700"
          letter-spacing="0.8px"
          class="radui-docs-badge-txt">DOCS</text>
  </g>
</svg>
