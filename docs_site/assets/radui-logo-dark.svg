<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dlMarkPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="dlMarkLoop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <linearGradient id="dlMarkKick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="dlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(14, 14) scale(0.23)">
    <!-- Stem -->
    <rect x="70" y="60" width="46" height="280" rx="23" fill="url(#dlMarkPrimary)" />
    <!-- Loop -->
    <path d="M 93 60 H 210 C 272 60, 316 100, 316 162 C 316 224, 272 264, 210 264 H 116"
          fill="none" stroke="url(#dlMarkLoop)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Kick -->
    <path d="M 188 234 L 294 340"
          fill="none" stroke="url(#dlMarkKick)" stroke-width="46" stroke-linecap="round" />
    <!-- Signal Nodes -->
    <g filter="url(#dlGlow)">
      <circle cx="93" cy="83" r="10" fill="#f0fdf4" stroke="#059669" stroke-width="3.5" />
      <circle cx="316" cy="162" r="10" fill="#f0fdf4" stroke="#10b981" stroke-width="3.5" />
      <circle cx="294" cy="340" r="12" fill="#ffffff" stroke="#34d399" stroke-width="4" />
    </g>
  </g>

  <!-- Wordmark "RADUI" in Crisp High-Contrast Pure White -->
  <g fill="#f8fafc">
    <text x="122" y="74"
          font-family="system-ui, -apple-system, 'SF Pro Display', Inter, 'Segoe UI', sans-serif"
          font-size="52"
          font-weight="900"
          letter-spacing="-1.5px">RADUI</text>
  </g>

  <!-- Tagline / Descriptor Badge -->
  <rect x="312" y="44" width="205" height="28" rx="7" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(52, 211, 153, 0.28)" stroke-width="1.2" />
  <text x="323" y="63"
        font-family="system-ui, -apple-system, Inter, sans-serif"
        font-size="11.5"
        font-weight="700"
        fill="#34d399"
        letter-spacing="0.8px">PYTHON REACTIVE UI</text>

  <!-- Subtitle in Muted Cool Grey -->
  <text x="124" y="98"
        font-family="system-ui, -apple-system, Inter, sans-serif"
        font-size="12"
        font-weight="500"
        fill="#94a3b8"
        letter-spacing="0.2px">The Python-First Reactive User Interface Framework</text>
</svg>
