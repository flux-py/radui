[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "radui"
version = "1.0.0"
description = "RADUI: Reactive Application Development User Interface framework for Python."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "RADUI Contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Framework :: Pydantic",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "starlette>=0.40,<1",
  "pydantic>=2.10,<3",
  "anyio>=4.0,<5",
  "itsdangerous>=2.0,<3",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30,<1"]
postgres = [
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.1",
]
redis = ["redis>=5.0"]
telemetry = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]
all = [
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.1",
  "redis>=5.0",
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.9",
  "mypy>=1.13",
]

[project.scripts]
radui = "radui.cli:main"
genesis = "radui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["radui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
