name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export RADUI-Native Static Documentation
        env:
          PYTHONPATH: .
        run: |
          python -m radui export docs_site/app.py --static --output ./dist_docs
          mkdir -p ./dist_docs/assets
          cp -R ./docs_site/assets/. ./dist_docs/assets/
          touch ./dist_docs/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist_docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
