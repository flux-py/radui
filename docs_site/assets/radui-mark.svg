<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="markPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="markLoop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <linearGradient id="markKick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Stem -->
  <rect x="70" y="60" width="46" height="280" rx="23" fill="url(#markPrimary)" />

  <!-- Radiating Upper Loop -->
  <path d="M 93 60
           H 210
           C 272 60, 316 100, 316 162
           C 316 224, 272 264, 210 264
           H 116"
        fill="none"
        stroke="url(#markLoop)"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Diagonal Kick -->
  <path d="M 188 234
           L 294 340"
        fill="none"
        stroke="url(#markKick)"
        stroke-width="46"
        stroke-linecap="round" />

  <!-- Glowing Signal Nodes (Reactive DAG) -->
  <g filter="url(#markGlow)">
    <circle cx="93" cy="83" r="10" fill="#f0fdf4" stroke="#059669" stroke-width="3.5" />
    <circle cx="316" cy="162" r="10" fill="#f0fdf4" stroke="#10b981" stroke-width="3.5" />
    <circle cx="294" cy="340" r="12" fill="#ffffff" stroke="#34d399" stroke-width="4" />
  </g>
</svg>
